<div id="modalEditarProduct" class="modal hide fade" tabindex="-1" style="background-color: #2c3e50; color: #ffffff;">
  <div class="modal-header" style="background-color: #1a252f; border-bottom: 1px solid #34495e;">
    <h3 style="color: #3498db; margin: 0;"><i class="icon-pencil"></i> Editar Producto</h3>
  </div>
  <div class="modal-body" style="max-height: 450px; overflow-y: auto;">
    <form class="form-horizontal" style="margin: 0;" @submit.prevent>
      <div class="control-group">
        <label class="control-label" style="color: #bdc3c7; text-align: left;">Nombre:</label>
        <div class="controls" style="margin-left: 0;">
          <input type="text" v-model="form.name" class="span12" style="background: #1a252f; color: #fff; border: 1px solid #4e6d8c;">
        </div>
      </div>
      <div class="control-group">
        <label class="control-label" style="color: #bdc3c7; text-align: left;">Precio (S/):</label>
        <div class="controls" style="margin-left: 0;">
          <input type="number" step="0.01" v-model.number="form.price" class="span12" style="background: #1a252f; color: #fff; border: 1px solid #4e6d8c;">
        </div>
      </div>
      <div class="control-group">
        <label class="control-label" style="color: #bdc3c7; text-align: left;">Stock (Cantidad):</label>
        <div class="controls" style="margin-left: 0;">
          <input type="number" v-model.number="form.stock" class="span12" style="background: #1a252f; color: #fff; border: 1px solid #4e6d8c;">
        </div>
      </div>
      <div class="control-group">
        <label class="control-label" style="color: #bdc3c7; text-align: left;">Descripción:</label>
        <div class="controls" style="margin-left: 0;">
          <textarea v-model="form.description" rows="3" class="span12" style="background: #1a252f; color: #fff; border: 1px solid #4e6d8c;"></textarea>
        </div>
      </div>
      <div class="control-group">
        <label class="control-label" style="color: #bdc3c7; text-align: left;">Contenido 01:</label>
        <div class="controls" style="margin-left: 0; color: #000;">
          <summernote-editor v-model="form.contenido01"></summernote-editor>
        </div>
      </div>
      <div class="control-group">
        <label class="control-label" style="color: #bdc3c7; text-align: left;">Contenido 02:</label>
        <div class="controls" style="margin-left: 0; color: #000;">
          <summernote-editor v-model="form.contenido02"></summernote-editor>
        </div>
      </div>

      <!-- Sección de Categorías y Subcategorías con Checkboxes -->
      <div class="control-group">
        <label class="control-label" style="color: #bdc3c7; text-align: left;">Categor&iacute;as:</label>
        <div class="controls" style="margin-left: 0;">
          <div style="background: #1a252f; border: 1px solid #4e6d8c; border-radius: 4px; padding: 10px;">
            <input type="text" v-model="busquedaCatEditar" placeholder="🔍 Buscar categor&iacute;a o subcategor&iacute;a..." class="span12" style="background: #2c3e50; color: #fff; border: 1px solid #4e6d8c; margin-bottom: 8px;">

            <div style="max-height: 220px; overflow-y: auto; padding-bottom: 5px;">
              <div v-for="g in arbolEditar" :key="g.cat.category_id">
                <!-- Categoría -->
                <label style="display: flex; align-items: center; padding: 6px 8px; cursor: pointer; color: #fff; font-size: 13px; margin: 0; border-bottom: 1px solid #34495e;">
                  <input type="checkbox" :value="g.cat.category_id" v-model="form.categorias" @change="limpiarSubHuerfana(form)" style="margin: 0 10px 0 0;">
                  <span>📁 <span v-text="g.cat.descripcion"></span></span>
                </label>
                <!-- Subcategorías de esa categoría -->
                <label v-for="s in g.subs" :key="'sc' + s.subcategoria_id" style="display: flex; align-items: center; padding: 5px 8px 5px 34px; cursor: pointer; color: #ecf0f1; font-size: 12px; margin: 0; border-bottom: 1px solid #2f4254; background: rgba(255,255,255,0.03);">
                  <input type="checkbox" :checked="form.subcategoria_id === s.subcategoria_id" @change="toggleSubcategoriaProducto(form, s, $event.target.checked)" style="margin: 0 10px 0 0;">
                  <img :src="s.img || imgSubDefecto" alt="" style="width: 20px; height: 20px; border-radius: 50%; object-fit: cover; margin-right: 8px; border: 1px solid #4e6d8c;">
                  <span v-text="s.nombre"></span>
                </label>
              </div>
              <div v-if="arbolEditar.length === 0" style="color: #95a5a6; font-size: 12px; padding: 5px;">
                No se encontraron categor&iacute;as
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
  <div class="modal-footer" style="background-color: #1a252f; border-top: 1px solid #34495e; text-align: left; display: flex; gap: 10px; align-items: center; justify-content: flex-start;">
    <button class="btn btn-primary" type="button" @click="guardarEdicion">Guardar Cambios</button>
    <button class="btn" data-dismiss="modal">Cancelar</button>
  </div>
</div>
