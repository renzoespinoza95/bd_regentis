<div class="modal-body" style="max-height: 450px; overflow-y: auto;">
  <div id="contenedorGaleriaImgs" style="display: flex; flex-wrap: wrap; gap: 15px; justify-content: flex-start; margin-bottom: 20px;">
    <!-- Se inyecta la lista de imágenes dinámicamente -->
  </div>

  <!-- Contenedor para ingresar y arrastrar URLs de enlaces (visible por defecto) -->
  <div id="panelInputUrl" style="background: #1a252f; border: 1px solid #34495e; border-radius: 8px; padding: 15px; margin-bottom: 15px;">
    <div style="font-weight: bold; font-size: 13px; color: #e67e22; margin-bottom: 6px;">Ingrese la URL de la imagen:</div>
    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
      <input type="text" id="inputUrlImagenPegar" class="span9" placeholder="https://ejemplo.com/imagen.jpg" style="background: #2c3e50; color: #fff; border: 1px solid #4e6d8c; margin: 0;">
      <button id="btnConfirmarUrl" class="btn btn-success span3" type="button">Aceptar</button>
    </div>

    <!-- ZONA DEBAJO PARA ARRASTRAR O PEGAR ENLACES URL DE ARCHIVOS CON PREVISUALIZACIÓN -->
    <div id="dropZoneUrls" style="border: 2px dashed #e67e22; background: #1a252f; border-radius: 6px; padding: 12px; text-align: center; cursor: pointer; margin-top: 10px;">
      <div style="font-size: 13px; color: #fff; font-weight: bold; margin-bottom: 2px;">Arrastra o pega enlaces URL de archivos aquí</div>
      <div style="font-size: 11px; color: #bdc3c7; margin-bottom: 6px;">(Escribe o pega una URL por línea)</div>
      <textarea id="textareaUrlsArrastradas" placeholder="https://ejemplo.com/img1.jpg&#10;https://ejemplo.com/img2.jpg" rows="3" style="width: 100%; box-sizing: border-box; background: #2c3e50; color: #fff; border: 1px solid #4e6d8c; font-size: 12px; resize: vertical;"></textarea>
      
      <!-- Contenedor de miniaturas para las URLs ingresadas -->
      <div id="previewUrlsContainer" style="display: none; margin-top: 10px; flex-wrap: wrap; gap: 10px; justify-content: center;">
        <!-- Se generan dinámicamente las miniaturas con la X -->
      </div>

      <div style="text-align: right; margin-top: 8px;">
        <button id="btnAgregarUrlsDrop" class="btn btn-primary btn-small" type="button" style="display: none;">
          <i class="icon-plus-sign icon-white"></i> Agregar URLs a la tabla
        </button>
      </div>
    </div>
  </div>

  <div id="dropZoneFoto" style="border: 2px dashed #27ae60; background: #1a252f; border-radius: 8px; padding: 25px; text-align: center; cursor: pointer; margin-top: 10px; position: relative;">
    <input type="file" id="inputArchivoFoto" accept="image/*" multiple style="display: none;">
    <div id="contenidoDropZone">
      <div style="font-size: 24px; margin-bottom: 8px;">📋</div>
      <div style="font-weight: bold; font-size: 15px; color: #fff; margin-bottom: 4px;">Pegar / Arrastrar Archivos (PC)</div>
      <div style="font-size: 12px; color: #bdc3c7;">(Clic para seleccionar o suelta archivos físicos aquí)</div>
    </div>
    <div id="previewArchivoContainer" style="display: none; margin-top: 10px; flex-wrap: wrap; gap: 10px; justify-content: center;">
      <!-- Miniaturas dinámicas con botón X -->
    </div>
  </div>

  <!-- Botón específico "Agregar" para las imágenes de archivos locales -->
  <div style="margin-top: 12px; text-align: right;">
    <button id="btnAgregarArrastradas" class="btn btn-primary" type="button" style="display: none;">
      <i class="icon-plus-sign icon-white"></i> Subir archivos y agregar a la tabla
    </button>
  </div>
</div>
