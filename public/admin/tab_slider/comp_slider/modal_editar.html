<div id="modalEditarSlider" class="modal hide fade fullscreen" tabindex="-1">
  <div class="modal-header"><h3>Editar Slider</h3></div>
  <div class="modal-body">
    <form class="form-horizontal">
      <div class="control-group">
        <label class="control-label">Imagen</label>
        <div class="controls">
          <input type="file" accept="image/*" ref="fileEditar" @change="onFileChange($event, 'editar')">

          <div class="zona-img"
               :class="{ arrastrando: formulario.arrastrando }"
               @dragover.prevent="zonaDragOver('editar')"
               @dragleave.prevent="zonaDragLeave('editar')"
               @drop.prevent="zonaDrop($event, 'editar')">

            <div v-if="formulario.imgPreview" class="zona-img-preview-box">
              <div class="zona-img-thumb">
                <img :src="formulario.imgPreview" alt="">
                <button type="button" class="zona-img-quitar" title="Quitar imagen" @click="quitarImagen('editar')">
                  <i class="fa fa-times"></i>
                </button>
              </div>
              <button type="button" class="btn btn-warning btn-mini zona-img-btn-url" title="Ver URL de la imagen" @click="mostrarUrlImagen('editar')">
                <i class="fa fa-pencil"></i>
              </button>
            </div>

            <div class="zona-img-titulo">Ingrese la URL de la imagen (o arrastre enlaces aquí):</div>
            <div class="zona-img-nota">Esta entidad tiene una sola imagen: la nueva URL reemplazará a la actual.</div>
            <div class="zona-img-fila">
              <input type="text" v-model.trim="formulario.urlInput" placeholder="https://ejemplo.com/imagen.jpg" @keyup.enter="aceptarUrl('editar')">
              <button type="button" class="btn btn-success" @click="aceptarUrl('editar')">Aceptar</button>
            </div>

            <div class="zona-img-drop">
              <strong>Arrastra o pega enlaces URL de archivos aquí</strong>
              <small>(Escribe o pega una URL por línea)</small>
              <textarea rows="3" v-model="formulario.urlsTexto" @paste="pegarUrls('editar')" placeholder="https://ejemplo.com/img1.jpg&#10;https://ejemplo.com/img2.jpg"></textarea>
              <button type="button" class="btn btn-warning btn-small" @click="usarUrl('editar')">Usar URL</button>
            </div>
          </div>
        </div>
      </div>
      <div class="control-group">
        <label class="control-label">Título Superior</label>
        <div class="controls">
          <input type="text" v-model.trim="formulario.titulo_superior" class="input-xxlarge" placeholder="Ingrese título superior">
        </div>
      </div>
      <div class="control-group">
        <label class="control-label">Descripción</label>
        <div class="controls">
          <textarea id="snEditarDescripcion"></textarea>
        </div>
      </div>
      <div class="control-group">
        <label class="control-label">Orden</label>
        <div class="controls">
          <input type="number" v-model.number="formulario.orden" class="input-small">
        </div>
      </div>
      <div class="control-group">
        <label class="control-label">Visible</label>
        <div class="controls">
          <select v-model.number="formulario.is_visible" class="input-small">
            <option :value="1">Sí</option>
            <option :value="0">No</option>
          </select>
        </div>
      </div>
      <div class="control-group">
        <label class="control-label">Fecha Fin</label>
        <div class="controls">
          <input type="datetime-local" v-model="formulario.fecha_fin" class="input-medium">
        </div>
      </div>
    </form>
  </div>
  <div class="modal-footer" style="text-align: left;">
    <button class="btn btn-info" @click="actualizarDescripcion">Descripción</button>
    <button class="btn btn-primary" @click="guardarEdicion">Guardar</button>
    <button class="btn" data-dismiss="modal">Cancelar</button>
  </div>
</div>
