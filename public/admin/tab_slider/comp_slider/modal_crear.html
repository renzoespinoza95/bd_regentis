<div id="modalCrearSlider" class="modal hide fade fullscreen" tabindex="-1">
  <div class="modal-header"><h3>Nuevo Slider</h3></div>
  <div class="modal-body">
    <form class="form-horizontal">
      <div class="control-group">
        <label class="control-label">Imagen</label>
        <div class="controls">
          <input type="file" accept="image/*" ref="fileCrear" @change="onFileChange($event, 'crear')">

          <div class="zona-img"
               :class="{ arrastrando: nuevo.arrastrando }"
               @dragover.prevent="zonaDragOver('crear')"
               @dragleave.prevent="zonaDragLeave('crear')"
               @drop.prevent="zonaDrop($event, 'crear')">

            <div v-if="nuevo.imgPreview" class="zona-img-preview-box">
              <div class="zona-img-thumb">
                <img :src="nuevo.imgPreview" alt="">
                <button type="button" class="zona-img-quitar" title="Quitar imagen" @click="quitarImagen('crear')">
                  <i class="fa fa-times"></i>
                </button>
              </div>
              <button type="button" class="btn btn-warning btn-mini zona-img-btn-url" title="Ver URL de la imagen" @click="mostrarUrlImagen('crear')">
                <i class="fa fa-pencil"></i>
              </button>
            </div>

            <div class="zona-img-titulo">Ingrese la URL de la imagen:</div>
            <div class="zona-img-fila">
              <input type="text" v-model.trim="nuevo.urlInput" placeholder="https://ejemplo.com/imagen.jpg" @keyup.enter="aceptarUrl('crear')">
              <button type="button" class="btn btn-success" @click="aceptarUrl('crear')">Aceptar</button>
            </div>

            <div class="zona-img-drop">
              <strong>Arrastra o pega enlaces URL de archivos aquí</strong>
              <small>(Escribe o pega una URL por línea)</small>
              <textarea rows="3" v-model="nuevo.urlsTexto" @paste="pegarUrls('crear')" placeholder="https://ejemplo.com/img1.jpg&#10;https://ejemplo.com/img2.jpg"></textarea>
              <button type="button" class="btn btn-warning btn-small" @click="usarUrl('crear')">Usar URL</button>
            </div>
          </div>
        </div>
      </div>
      <div class="control-group">
        <label class="control-label">Título Superior</label>
        <div class="controls">
          <input type="text" v-model.trim="nuevo.titulo_superior" class="input-xxlarge" placeholder="Ingrese título superior">
        </div>
      </div>
      <div class="control-group">
        <label class="control-label">Descripción</label>
        <div class="controls">
          <textarea id="snCrearDescripcion"></textarea>
        </div>
      </div>
      <div class="control-group">
        <label class="control-label">Orden</label>
        <div class="controls">
          <input type="number" v-model.number="nuevo.orden" class="input-small">
        </div>
      </div>
      <div class="control-group">
        <label class="control-label">Visible</label>
        <div class="controls">
          <select v-model.number="nuevo.is_visible" class="input-small">
            <option :value="1">Sí</option>
            <option :value="0">No</option>
          </select>
        </div>
      </div>
      <div class="control-group">
        <label class="control-label">Fecha Fin</label>
        <div class="controls">
          <input type="datetime-local" v-model="nuevo.fecha_fin" class="input-medium">
        </div>
      </div>
    </form>
  </div>
  <div class="modal-footer" style="text-align: left;">
    <button class="btn btn-primary" @click="crearSlider">Crear</button>
    <button class="btn" data-dismiss="modal">Cancelar</button>
  </div>
</div>
