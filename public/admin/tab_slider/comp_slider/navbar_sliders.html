<div class="row-fluid" style="margin-top: 50px;">
  <div class="span12">
    <div class="row-fluid" style="margin-bottom: 20px;">
      <div class="span6">
        <h2>Gestión de Sliders</h2>
      </div>
      <div class="span6" style="text-align: right;">
        <button class="btn btn-success" @click="abrirModalCrear" style="margin-right: 5px;">
          <i class="fa fa-plus"></i> Nuevo Slider
        </button>
        <button class="btn btn-info" @click="crearSliderAutomatico">
          <i class="fa fa-magic"></i> Automático
        </button>
      </div>
    </div>

    <table id="tablaSliders" class="table table-bordered table-striped" style="width:100%; background-color: #fff; color: #000;">
      <thead>
        <tr>
          <th style="text-align: center;"></th>
          <th style="text-align: center;">ID</th>
          <th style="text-align: center;">Vista</th>
          <th>Descripción</th>
          <th style="text-align: center;">Orden</th>
          <th style="text-align: center;">Visible</th>
        </tr>
      </thead>
      <tbody id="sortable">
        <tr v-for="s in sliders" :key="s.slider_id" :data-id="s.slider_id" :class="{ 'fila-oculta': s.is_visible != 1 }">
          <td style="text-align: center; vertical-align: middle;">
            <div class="btn-group">
              <button class="btn btn-mini dropdown-toggle" data-toggle="dropdown">
                ⚙ <span class="caret"></span>
              </button>
              <ul class="dropdown-menu" style="text-align: left;">
                <li><a href="#" @click.prevent="abrirModalEditar(s)">Editar</a></li>
                <li><a href="#" @click.prevent="eliminarSlider(s)">Eliminar</a></li>
                <li><a href="#" @click.prevent="abrirModalDetalle(s)">Detalle</a></li>
              </ul>
            </div>
          </td>
          <td style="text-align: center; vertical-align: middle; color: #000; font-weight: bold;">[[ s.slider_id ]]</td>
          <td style="text-align: center; vertical-align: middle;">
            <img :src="s.img_thumb" class="img-miniatura" title="Ver imagen" style="max-width:100px; max-height:60px; cursor: zoom-in;" @click="verImagenGrande(s.img)" />
          </td>
          <td style="vertical-align: middle; color: #000;" v-html="s.descripcion"></td>
          <td :data-order="s.orden" style="text-align:center; vertical-align: middle;">
            <span class="label label-info drag-handle" style="cursor:move; padding: 5px 10px;">
              ⇅ ([[ s.orden ]])
            </span>
          </td>
          <td style="text-align: center; vertical-align: middle;">
            <input type="checkbox" style="margin: 0; cursor: pointer;" :checked="s.is_visible == 1" @change="cambiarVisible(s, $event)" title="Visible">
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
