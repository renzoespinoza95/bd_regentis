<div class="row">
  <div class="span12">
    <div class="well" style="padding: 12px 20px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between;">
      <h3 style="margin: 0; line-height: 30px; font-size: 22px;">
        <i class="icon-briefcase icon-white"></i> Negocios
      </h3>
      <div class="btn-group" style="margin: 0;">
        <button class="btn btn-primary dropdown-toggle" data-toggle="dropdown">
          <i class="icon-cog icon-white"></i> Acciones <span class="caret"></span>
        </button>
        <ul class="dropdown-menu pull-right">
          <li><a href="#" @click.prevent="abrirModalCrearNeg"><i class="icon-plus"></i> Agregar Negocio</a></li>
          <li><a href="#" @click.prevent="abrirModalMercados"><i class="icon-th-large"></i> Mercados</a></li>
        </ul>
      </div>
    </div>

    <div class="well">
      <table id="tablaNeg" class="table table-striped table-bordered" style="width:100%">
        <thead>
          <tr>
            <th>ID</th>
            <th>Logo</th>
            <th>Nombre</th>
            <th>Puesto</th>
            <th>Mercado</th>
            <th>Fin Premium</th>
            <th>Rubros</th>
            <th>Activo</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <!-- Rellenado dinámicamente por DataTable -->
        </tbody>
      </table>
    </div>
  </div>
</div>
