
<meta charset="utf-8">
<title>{{title}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    padding-top: 60px;
  }
  .modal {
    position: fixed;
    z-index: 1060 !important;
  }
  .modal.fade.in {
    z-index: 1060 !important;
  }
  .modal-backdrop {
    z-index: 1050 !important;
  }
  .img-item {
    position: relative;
    width: 120px;
    text-align: center;
    cursor: move;
  }
  .img-item img {
    width: 100px;
    height: 100px;
    object-fit: cover;
  }
  .orden-circle {
    position: absolute;
    top: 5px;
    right: 10px;
    background: #ff5722;
    color: #fff;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-size: 12px;
    line-height: 22px;
    text-align: center;
    font-weight: bold;
  }

  /* =========================================================
     CARRUSEL DE CATEGORÍAS
  ========================================================= */
  #appPagWeb .cat-carousel-wrap {
    position: relative !important;
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    width: 100% !important;
  }

  #appPagWeb .cat-carousel-btn {
    position: absolute !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    z-index: 10 !important;
    width: 28px !important;
    height: 28px !important;
    padding: 0 !important;
    line-height: 26px !important;
    text-align: center !important;
    background: #333333 !important;
    color: #ffffff !important;
    border: none !important;
    border-radius: 50% !important;
    cursor: pointer;
  }
  #appPagWeb .cat-carousel-btn.izq { left: -10px !important; }
  #appPagWeb .cat-carousel-btn.der { right: -10px !important; }

  #appPagWeb .cat-carousel-track {
    display: flex !important;
    flex-direction: row !important;
    flex-wrap: nowrap !important;
    gap: 10px !important;
    overflow-x: auto !important;
    overflow-y: hidden !important;
    scroll-behavior: smooth;
    white-space: nowrap !important;
    width: 100% !important;
    padding: 5px 18px !important;
  }

  .hide-scrollbar {
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .hide-scrollbar::-webkit-scrollbar {
    display: none;
  }

  /* Tarjeta de categoría */
  #appPagWeb .cat-card {
    display: block !important;
    flex: 0 0 auto !important;
    min-width: 160px !important;
    padding: 10px 12px !important;
    border: 1px solid #d0d7de !important;
    border-radius: 4px !important;
    text-decoration: none !important;
    background-color: #ffffff !important;
    color: #2c3e50 !important;
    transition: all 0.2s ease;
  }
  #appPagWeb .cat-card:hover {
    border-color: #0088cc !important;
  }
  #appPagWeb .cat-card.activa {
    background-color: #0088cc !important;
    border-color: #0088cc !important;
    color: #ffffff !important;
  }

  /* Tarjeta de subcategoría */
  #appPagWeb .subcat-list {
    max-height: 550px;
    overflow-y: auto;
    margin-bottom: 0;
  }
  #appPagWeb .subcat-card {
    display: block !important;
    padding: 10px 12px !important;
    margin-bottom: 5px !important;
    border: 1px solid #d0d7de !important;
    border-radius: 4px !important;
    text-decoration: none !important;
    background-color: #ffffff !important;
    color: #2c3e50 !important;
    transition: all 0.2s ease;
  }
  #appPagWeb .subcat-card:hover {
    border-color: #5bb75b !important;
  }
  #appPagWeb .subcat-card.activa {
    background-color: #5bb75b !important;
    border-color: #5bb75b !important;
    color: #ffffff !important;
  }

  /* Contenido interno compartido */
  #appPagWeb .cat-card-body,
  #appPagWeb .subcat-card-body {
    display: flex !important;
    flex-direction: row !important;
    justify-content: space-between !important;
    align-items: center !important;
    gap: 10px !important;
  }
  #appPagWeb .cc-titulo {
    display: block !important;
    font-weight: 700 !important;
    font-size: 13px !important;
    letter-spacing: 0.3px;
    color: inherit !important;
  }
  #appPagWeb .cc-clave {
    display: block !important;
    font-size: 11px !important;
    margin-top: 2px !important;
    color: inherit !important;
    opacity: 0.85;
  }
  #appPagWeb .cc-img {
    display: block !important;
    margin-top: 5px !important;
    width: 32px !important;
    height: 32px !important;
    object-fit: cover !important;
    border-radius: 3px !important;
    border: 1px solid #cccccc !important;
  }
  #appPagWeb .cat-card .cc-img {
    width: 28px !important;
    height: 28px !important;
  }
  #appPagWeb .cc-badge {
    flex: 0 0 auto !important;
    background-color: #e9ecef !important;
    color: #2c3e50 !important;
    font-weight: bold !important;
    border: 1px solid #ced4da !important;
  }
  #appPagWeb .cat-card.activa .cc-badge {
    background-color: #005580 !important;
    color: #ffffff !important;
    border-color: #005580 !important;
  }
  #appPagWeb .subcat-card.activa .cc-badge {
    background-color: #387038 !important;
    color: #ffffff !important;
    border-color: #387038 !important;
  }

  /* =========================================================
     CATEGORÍAS / SUBCATEGORÍAS CON is_visible = 0
     (se siguen viendo, pero en gris y cursiva)
  ========================================================= */
  #appPagWeb .cat-card.invisible-gris,
  #appPagWeb .subcat-card.invisible-gris {
    color: #9aa0a6 !important;
    font-style: italic !important;
  }
  #appPagWeb .cat-card.invisible-gris .cc-titulo,
  #appPagWeb .cat-card.invisible-gris .cc-clave,
  #appPagWeb .subcat-card.invisible-gris .cc-titulo,
  #appPagWeb .subcat-card.invisible-gris .cc-clave {
    font-style: italic !important;
    color: #9aa0a6 !important;
  }
  #appPagWeb .cat-card.invisible-gris .cc-img,
  #appPagWeb .subcat-card.invisible-gris .cc-img {
    opacity: 0.5;
    filter: grayscale(100%);
  }
  /* Si además está seleccionada, el texto se aclara para que se lea sobre el fondo de color */
  #appPagWeb .cat-card.invisible-gris.activa .cc-titulo,
  #appPagWeb .cat-card.invisible-gris.activa .cc-clave,
  #appPagWeb .subcat-card.invisible-gris.activa .cc-titulo,
  #appPagWeb .subcat-card.invisible-gris.activa .cc-clave {
    color: #e3e8ec !important;
  }

  /* =========================================================
     MINIATURAS DE IMÁGENES EN LA TABLA DE ITEMS
  ========================================================= */
  #tablaItems .item-thumbs {
    display: flex !important;
    flex-wrap: wrap !important;
    gap: 4px !important;
    margin-top: 5px !important;
  }
  #tablaItems .item-thumb {
    width: 36px !important;
    height: 36px !important;
    object-fit: cover !important;
    border-radius: 3px !important;
    border: 1px solid #cccccc !important;
    cursor: pointer;
  }
  #tablaItems .item-thumb:hover {
    border-color: #0088cc !important;
  }
</style>

{{{assets_head}}}
