<div id="modalDetalleUsuario" class="modal hide fade" tabindex="-1">
    <div class="modal-header"><h3>Detalle Usuario</h3></div>
    <div class="modal-body">
      <dl class="dl-horizontal">
        <dt>ID</dt><dd>[[ detalle.usu_id ]]</dd>
        <dt>Código</dt><dd>[[ detalle.cod_usu ]]</dd>
        <dt>Sobrenombre</dt><dd>[[ detalle.sobrenombre ]]</dd>
        <dt>Celular</dt><dd>[[ detalle.celular ]]</dd>
      </dl>
    </div>
    <div class="modal-footer"><button class="btn" data-dismiss="modal">Cerrar</button></div>
</div>
