<!DOCTYPE html>
<html lang="es">
<head>
    {{> head}}
</head>
<body>
  <div class="navbar navbar-fixed-top">
    <div class="navbar-inner">
      {{{ menu_html }}}
    </div>
  </div>

  <div class="container" id="appUsuario" style="margin-top: 60px;">
    <div class="row-fluid">
      <div class="span12">
        <h2>{{ title }}</h2>

        <div class="form-actions">
          <button class="btn btn-success" @click="abrirModalCrear">
            <i class="icon-plus icon-white"></i> Nuevo Usuario
          </button>
          <button class="btn btn-info" @click="abrirModalBuscar">
            <i class="icon-search icon-white"></i> Buscar Usuario
          </button>
        </div>

        <!-- Tabla principal de usuarios -->
        {{> tabla_usuarios}}

      </div>
    </div>

    <!-- Modales del sistema de usuarios -->
    {{> modal_crear}}
    {{> modal_editar}}
    {{> modal_detalle}}
    {{> modal_buscar}}
  </div>

  <div class="container" style="margin-top: 30px;">
    {{{ footer_html }}}
  </div>

  <!-- Scripts modulares de la aplicación -->
  {{> scripts}}
</body>
</html>
